name: EduSpark Backup

# Har Sunday (IST subah ~7:30) content/quizzes/pyq/_config ka backup. Artifact 30 din rehta hai.
# "Run workflow" se kabhi bhi turant chala sakte hain.
# NOTE: repo public ho to artifact GitHub-login wale koi bhi dekh sakte hain — isiliye
#       sirf public content backup hota hai (students/doubts nahi).
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eduspark-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Dependencies (package.json ke pinned range se)
        run: npm ci || npm install
      - name: Backup banao
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.js backups
      - uses: actions/upload-artifact@v7
        with:
          name: eduspark-backup
          path: backups/*.json
          retention-days: 30
          if-no-files-found: error