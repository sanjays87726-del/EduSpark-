name: EduSpark Notifications

# Kaun trigger karta hai:
#   1) Cloudflare Worker `eduspark-cron` (cron-trigger/ folder) — ThIK samay par: 7:30, 2:00, 7:00 IST (+ 11:00 inactivity)
#      GitHub ka apna `schedule` best-effort hai (10-60 min late ya skip ho sakta hai), isliye wo ab sirf BACKUP hai.
#   2) Backup schedule: har 20 min (GitHub late/skip kare to bhi 150 min ki khidki me slot pakad leta hai)
#   3) "Run workflow" button
# Script: admin broadcast turant + roz 3 study reminder + 1 inactivity reminder. Sab kuch fail ho to run laal (GitHub email).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

# Do runs ek saath chalein to duplicate notification na jaye (slot-claim bhi isse bachata hai)
concurrency:
  group: eduspark-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Node.js setup karo
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Dependencies (package.json ke pinned range se)
        run: npm ci || npm install

      - name: Notifications bhejo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DAILY_SLOTS: 'on'          # subah/dopahar/shaam reminders band karne ke liye 'off' likhein
          ENABLED_SLOTS: ''          # khali = teeno; 'morning,evening' = dopahar band (Firestore reads bachte hain)
          INACTIVITY_DAYS: '1'       # kitne din inactive rehne par 'wapas aao' reminder
        run: node scripts/send-notifications.js
