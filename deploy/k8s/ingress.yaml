apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eduspark-web
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt      # TLS ke liye (cert-manager install hone par)
spec:
  ingressClassName: nginx
  rules:
    - host: eduspark.de5.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduspark-web
                port:
                  number: 80
  # tls:
  #   - hosts: [eduspark.de5.net]
  #     secretName: eduspark-tls
