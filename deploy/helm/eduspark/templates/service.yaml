apiVersion: v1
kind: Service
metadata:
  name: {{ include "eduspark.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "eduspark.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "eduspark.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    eduspark/color: {{ .Values.service.activeColor }}      # stable + canary dono (track alag, color same)
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
