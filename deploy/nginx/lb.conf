# Load balancer (nginx) — Docker ke DNS (127.0.0.11) se "web" ke saare containers dhoondta hai (service discovery)
# docker compose up --scale web=3  → teeno ke beech round-robin; ek container girne par agle par failover.
server {
  listen 8080;
  resolver 127.0.0.11 valid=5s ipv6=off;

  location / {
    set $upstream http://web:8080;                 # variable => har request par DNS dobara resolve (naye/purane containers dikhte hain)
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;   # kharab container se agle par
    proxy_next_upstream_tries 3;
  }
}
