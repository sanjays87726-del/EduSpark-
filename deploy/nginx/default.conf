server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Liveness/readiness (Docker, Kubernetes, load balancer)
  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Service worker + app shell: har baar revalidate, taaki naya version turant mile (sw.js ko kabhi lamba cache mat do)
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.json {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
